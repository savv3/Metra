services:
  web:
    build:
      context: .
      args:
        # Extra plugin packages to install into the image (see docs/plugins.md).
        METRA_PLUGIN_PACKAGES: ${METRA_PLUGIN_PACKAGES:-}
    image: ${METRA_IMAGE:-metra:latest}
    command: web
    env_file: .env
    environment:
      # Caddy sets X-Forwarded-For; used to rate-limit the member pages.
      METRA_TRUST_X_FORWARDED_FOR: "true"
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      # Sent with the install's own host name: METRA_ALLOWED_HOSTS may not
      # include 127.0.0.1.
      test: ["CMD", "python", "-c", "import os,sys,urllib.request as u; r=u.Request('http://127.0.0.1:8000/healthz', headers={'Host': os.environ.get('METRA_DOMAIN') or 'localhost'}); sys.exit(0 if u.urlopen(r, timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${METRA_IMAGE:-metra:latest}
    command: worker
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      METRA_DOMAIN: ${METRA_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  data:
  caddy_data:
  caddy_config:
