services:
  web:
    build:
      context: .
      args:
        # Extra plugin packages to install into the image (see docs/plugins.md).
        # Each ${METRA_X:-${SCR_X:-...}} also reads an .env from before the
        # rename to Metra, when the settings were called SCR_X.
        METRA_PLUGIN_PACKAGES: ${METRA_PLUGIN_PACKAGES:-${SCR_PLUGIN_PACKAGES:-}}
    image: ${METRA_IMAGE:-${SCR_IMAGE:-metra:latest}}
    command: web
    env_file: .env
    environment:
      # Caddy sets X-Forwarded-For; used to rate-limit the member pages.
      METRA_TRUST_X_FORWARDED_FOR: "true"
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${METRA_IMAGE:-${SCR_IMAGE:-metra:latest}}
    command: worker
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      METRA_DOMAIN: ${METRA_DOMAIN:-${SCR_DOMAIN:-localhost}}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  data:
  caddy_data:
  caddy_config:
