services:
  web:
    build: .
    image: smallcompanyregister:latest
    command: web
    env_file: .env
    environment:
      # Caddy sets X-Forwarded-For; used to rate-limit the member pages.
      SCR_TRUST_X_FORWARDED_FOR: "true"
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: smallcompanyregister:latest
    command: worker
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SCR_DOMAIN: ${SCR_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  data:
  caddy_data:
  caddy_config:
