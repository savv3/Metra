[project]
name = "metra-meetings"
version = "0.1.0"
description = "Metra plugin: call, minute and approve meetings, and publish approved minutes to members."
requires-python = ">=3.13"
license = "MIT"
dependencies = []

# METRA_PLUGINS=meetings enables it.
[project.entry-points."metra.plugins"]
meetings = "metra_meetings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metra_meetings"]
