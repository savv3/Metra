[project]
name = "metra-webhooks"
version = "0.1.0"
description = "Metra plugin: send signed webhooks to outside systems when things change."
requires-python = ">=3.13"
license = "MIT"
dependencies = []

# METRA_PLUGINS=webhooks enables it.
[project.entry-points."metra.plugins"]
webhooks = "metra_webhooks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metra_webhooks"]
