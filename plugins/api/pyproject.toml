[project]
name = "metra-api"
version = "0.1.0"
description = "A REST API for Metra: units, people, readings and invoices for other systems, with tokens per client."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
]

# Enabled with METRA_PLUGINS=api. Not on by default: an installation turns it on.
[project.entry-points."metra.plugins"]
api = "metra_api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metra_api"]
