[project]
name = "scr-example-plugin"
version = "0.1.0"
description = "A minimal SmallCompanyRegister plugin: a menu item, a unit panel and an SMS provider."
requires-python = ">=3.13"
license = "MIT"
dependencies = []

# This is what makes the package a plugin: SCR_PLUGINS=example enables it.
[project.entry-points."scr.plugins"]
example = "scr_example_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scr_example_plugin"]
