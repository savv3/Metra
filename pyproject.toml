[project]
name = "metra"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth[mfa]>=65.20.0",
    "django-auditlog>=3.4.1",
    "gunicorn>=26.2.0",
    "huey>=3.4.0",
    "python-barcode>=0.16.1",
    "segno>=1.6.6",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "metra-example-plugin",
]

[tool.uv.sources]
# The example plugin, installed for the tests (METRA_PLUGINS=example there).
metra-example-plugin = { path = "plugins/example", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
