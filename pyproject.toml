[project]
name = "metra"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "django>=5.2,<5.3",
    "django-allauth[mfa]>=65.20.0",
    "django-auditlog>=3.4.1",
    "gunicorn>=26.2.0",
    "huey>=3.4.0",
    "markdown>=3.11.2",
    "python-barcode>=0.16.1",
    "segno>=1.6.6",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
    # Official plugins (plugins/), installed in the Docker image. Bundled ones
    # are on by default (config.plugins.BUNDLED); the rest need METRA_PLUGINS.
    "metra-api",
    "metra-email-mailgun",
    "metra-meetings",
    "metra-sms-46elks",
    "metra-webhooks",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "metra-example-plugin",
]

# Every package in plugins/ is a plugin developed alongside Metra. They share
# one lock file and are tested in CI; each can later move to its own repository.
[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
# The example plugin, installed for the tests (METRA_PLUGINS=example there).
metra-example-plugin = { workspace = true }
metra-api = { workspace = true }
metra-email-mailgun = { workspace = true }
metra-meetings = { workspace = true }
metra-sms-46elks = { workspace = true }
metra-webhooks = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
