{% load i18n %}<a class="bell{% if count %} bell--unread{% endif %}" href="{% url 'notifications:list' %}"{% if current %} aria-current="page"{% endif %}
  aria-label="{% if count %}{% blocktranslate count counter=count trimmed %}Notifications, {{ counter }} unread{% plural %}Notifications, {{ counter }} unread{% endblocktranslate %}{% else %}{% translate 'Notifications' %}{% endif %}">
  <svg class="bell__icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
  {% if count %}<span class="bell__count" aria-hidden="true">{{ shown }}</span>{% endif %}
</a>
