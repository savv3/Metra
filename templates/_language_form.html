{% load i18n %}{% get_current_language as LANGUAGE_CODE %}
<form class="lang-form" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <label for="language{{ suffix }}">{% translate "Language" %}</label>
  <select id="language{{ suffix }}" name="language" onchange="this.form.submit()">
    {% get_available_languages as LANGUAGES %}
    {% for code, name in LANGUAGES %}
      <option value="{{ code }}"{% if code == LANGUAGE_CODE %} selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit">{% translate "Change" %}</button></noscript>
</form>
